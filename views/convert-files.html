<section id="view-convert-files" class="animate-fade-in" hidden>
  <div class="mt-9 mb-5">
    <button class="inline-flex items-center gap-1.5 bg-transparent border-none text-inksoft text-sm font-semibold cursor-pointer py-1.5 hover:text-ink" id="btn-convert-files-back" type="button">
      <i class="bi bi-chevron-left text-base leading-none"></i>
      กลับหน้าหลัก
    </button>
  </div>

  <div class="flex items-center gap-3 mb-5">
    <span class="flex h-9 w-9 flex-none items-center justify-center rounded-full bg-accentsoft text-accent">
      <i class="bi bi-arrow-repeat text-lg leading-none"></i>
    </span>
    <h2 class="text-xl font-extrabold">แปลงไฟล์</h2>
  </div>

  <div class="grid grid-cols-2 gap-2.5">
    <div>
      <label class="block text-[12px] font-semibold text-inksoft mb-1.5" for="convert-from">จากไฟล์</label>
      <select id="convert-from" class="w-full px-2.5 py-2 rounded-lg border border-line bg-surface2 text-ink text-[13px] focus:outline focus:outline-2 focus:outline-accent focus:outline-offset-1">
        <option value="word">Word (.doc, .docx)</option>
        <option value="excel">Excel (.xls, .xlsx, .csv)</option>
        <option value="powerpoint">PowerPoint (.ppt, .pptx)</option>
        <option value="image">รูปภาพ (JPG/PNG)</option>
        <option value="html">HTML</option>
        <option value="text">ข้อความ (.txt)</option>
        <option value="pdf">PDF</option>
      </select>
    </div>
    <div>
      <label class="block text-[12px] font-semibold text-inksoft mb-1.5" for="convert-to">เป็นไฟล์</label>
      <select id="convert-to" class="w-full px-2.5 py-2 rounded-lg border border-line bg-surface2 text-ink text-[13px] focus:outline focus:outline-2 focus:outline-accent focus:outline-offset-1"></select>
    </div>
  </div>

  <p id="convert-stage-note" class="text-[12px] text-inksoft mt-3 leading-relaxed"></p>

  <!-- Generic upload/convert panel — reused for every enabled from/to pair,
       reconfigured by JS (accept, hint text, single/multiple, run handler)
       instead of duplicating one panel per pair. -->
  <div id="convert-stage" class="mt-3" hidden>
    <div id="convert-mode-wrap" class="mb-3" hidden>
      <label class="block text-[12px] font-semibold text-inksoft mb-1.5" for="convert-mode">รูปแบบผลลัพธ์</label>
      <select id="convert-mode" class="w-full px-2.5 py-2 rounded-lg border border-line bg-surface2 text-ink text-[13px] focus:outline focus:outline-2 focus:outline-accent focus:outline-offset-1"></select>
    </div>
    <div id="convert-dropzone" class="border-2 border-dashed border-line rounded-2xl bg-surface px-6 py-7 text-center cursor-pointer transition-colors duration-150" tabindex="0" role="button" aria-label="อัปโหลดไฟล์">
      <i class="bi bi-cloud-arrow-up text-2xl text-inkfaint mb-2 block"></i>
      <div><strong class="text-sm font-bold" id="convert-dropzone-title">ลากไฟล์มาวางที่นี่</strong></div>
      <p class="text-[12.5px] text-inksoft mt-1" id="convert-dropzone-hint">หรือ <span class="text-accentdeep font-semibold underline underline-offset-2">เลือกไฟล์จากเครื่อง</span></p>
      <div class="text-bad text-[12.5px] mt-2 text-center" id="convert-upload-error"></div>
    </div>
    <input type="file" id="convert-file-input" class="sr-only" />

    <div id="convert-file-list" class="flex flex-col gap-2 mt-4"></div>

    <button class="btn w-full mt-4 px-3.5 py-2.5 rounded-xl border-none bg-accent text-accentink text-sm font-bold cursor-pointer flex items-center justify-center gap-2 hover:bg-accentdeep disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-accent" id="btn-convert-run" type="button" disabled>
      <span class="spinner hidden w-[15px] h-[15px] rounded-full border-2 border-white/40 border-t-current animate-spin"></span>
      <span class="btn-label" id="convert-run-label">แปลงไฟล์</span>
    </button>
    <div class="progress-track hidden h-[5px] rounded-full bg-surface2 mt-3 overflow-hidden" id="convert-stage-progress"><div class="progress-fill h-full bg-accent rounded-full w-0 transition-[width] duration-150"></div></div>
    <div class="status-line mt-2.5 text-[12.5px] min-h-[16px]" id="convert-stage-status"></div>
  </div>

  <!-- Pairs that would need a server-side rendering engine (PowerPoint) —
       same "coming soon" idea as the disabled home-page tiles. -->
  <div id="convert-stage-disabled" class="mt-3 rounded-2xl border border-line bg-surface px-5 py-8 text-center" hidden>
    <i class="bi bi-hourglass-split text-2xl text-inkfaint mb-2 block"></i>
    <p class="text-sm font-bold">เร็วๆ นี้</p>
    <p class="text-[12.5px] text-inksoft mt-1 max-w-[360px] mx-auto">การแปลงคู่นี้ต้องใช้เอนจินประมวลผลฝั่งเซิร์ฟเวอร์ (เช่น LibreOffice) ซึ่งขัดกับสถาปัตยกรรม client-side ล้วนๆ ของแอปนี้ ยังไม่รองรับในตอนนี้</p>
  </div>

  <!-- PDF -> JPG/PNG already exists as its own home-page tool; redirect
       instead of duplicating the implementation. -->
  <div id="convert-stage-alias" class="mt-3 rounded-2xl border border-line bg-surface px-5 py-8 text-center" hidden>
    <i class="bi bi-image text-2xl text-accent mb-2 block"></i>
    <p class="text-sm font-bold">มีเครื่องมือนี้อยู่แล้ว</p>
    <p class="text-[12.5px] text-inksoft mt-1 max-w-[360px] mx-auto">ไปที่ "แปลง PDF เป็นรูปภาพ" บนหน้าแรกได้เลย</p>
    <button type="button" id="btn-convert-alias-pdf-image" class="btn w-auto mt-3.5 px-4 py-2 rounded-xl border-none bg-accent text-accentink text-sm font-bold cursor-pointer hover:bg-accentdeep">ไปที่เครื่องมือแปลงเป็นรูปภาพ</button>
  </div>

  <!-- Off-screen render target for the html2canvas-based conversions (Word,
       Excel, HTML, Text -> PDF): needs real layout, so it's pushed off-screen
       with a fixed page width rather than display:none. -->
  <div id="convert-render" style="position:fixed; left:-9999px; top:0; width:794px; background:#ffffff; color:#000000;"></div>
</section>
