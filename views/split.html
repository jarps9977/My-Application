<section id="view-split" class="animate-fade-in" hidden>
  <div class="mt-9 mb-5">
    <button class="inline-flex items-center gap-1.5 bg-transparent border-none text-inksoft text-sm font-semibold cursor-pointer py-1.5 hover:text-ink" id="btn-split-back" type="button">
      <i class="bi bi-chevron-left text-base leading-none"></i>
      กลับหน้าหลัก
    </button>
  </div>

  <div class="flex items-center gap-3 mb-5">
    <span class="flex h-9 w-9 flex-none items-center justify-center rounded-full bg-accentsoft text-accent">
      <i class="bi bi-scissors text-lg leading-none"></i>
    </span>
    <h2 class="text-xl font-extrabold">แยกไฟล์ PDF</h2>
  </div>

  <div id="split-dropzone" class="border-2 border-dashed border-line rounded-2xl bg-surface px-6 py-7 text-center cursor-pointer transition-colors duration-150" tabindex="0" role="button" aria-label="อัปโหลดไฟล์ PDF">
    <i class="bi bi-cloud-arrow-up text-2xl text-inkfaint mb-2 block"></i>
    <div><strong class="text-sm font-bold">ลากไฟล์ PDF มาวางที่นี่</strong></div>
    <p class="text-[12.5px] text-inksoft mt-1">หรือ <span class="text-accentdeep font-semibold underline underline-offset-2">เลือกไฟล์จากเครื่อง</span> — ประมวลผลในเบราว์เซอร์ทั้งหมด</p>
    <div class="text-bad text-[12.5px] mt-2 text-center" id="split-upload-error"></div>
  </div>
  <input type="file" id="split-file-input" accept="application/pdf,.pdf" class="sr-only" />

  <div id="split-password-card" class="flex-col gap-3 bg-surface border border-line rounded-2xl p-3.5 shadow-sm mt-3.5" style="display:none;">
    <div class="flex items-center gap-3">
      <span class="flex h-[38px] w-[38px] flex-none items-center justify-center rounded-full bg-accentsoft text-accent">
        <i class="bi bi-shield-lock text-lg leading-none"></i>
      </span>
      <div>
        <div class="font-bold text-[14.5px]" id="split-password-filename">—</div>
        <div class="text-[12.5px] text-inksoft mt-0.5">ไฟล์นี้ถูกป้องกันด้วยรหัสผ่าน กรอกรหัสเพื่อเปิดใช้งาน</div>
      </div>
    </div>
    <div class="flex gap-2.5">
      <input type="password" id="split-password-input" class="flex-1 w-full px-2.5 py-2 rounded-lg border border-line bg-surface2 text-ink text-[13.5px] focus:outline focus:outline-2 focus:outline-accent focus:outline-offset-1" placeholder="รหัสผ่าน" autocomplete="new-password" />
      <button class="btn w-auto mt-0 px-4 py-2 whitespace-nowrap rounded-xl border-none bg-accent text-accentink text-sm font-bold cursor-pointer flex items-center justify-center gap-2 hover:bg-accentdeep" id="btn-split-unlock" type="button">
        <span class="spinner hidden w-[15px] h-[15px] rounded-full border-2 border-white/40 border-t-current animate-spin"></span>
        <span class="btn-label">ปลดล็อก</span>
      </button>
    </div>
    <div class="text-[12.5px] min-h-[16px] text-bad" id="split-password-error"></div>
  </div>

  <div id="split-doc-card" class="flex gap-3.5 items-center bg-surface border border-line rounded-2xl px-3.5 py-3 shadow-sm" style="display:none; margin-top:14px;">
    <div class="w-[52px] h-[68px] flex-none rounded-lg overflow-hidden bg-surface2 border border-line flex items-center justify-center" id="split-doc-thumb"></div>
    <div class="flex-1 min-w-0">
      <div class="font-bold text-[14.5px] whitespace-nowrap overflow-hidden text-ellipsis" id="split-doc-name">—</div>
      <div class="text-[12.5px] text-inksoft mt-0.5"><span id="split-doc-pages">—</span> · <span class="text-inkfaint" id="split-doc-size">—</span></div>
      <div class="items-center gap-1.5 text-[12.5px] text-good mt-0.5 font-semibold" id="split-doc-lock-note" style="display:none;">
        <i class="bi bi-lock-fill text-xs leading-none"></i>
        ปลดล็อกด้วยรหัสผ่านแล้ว
      </div>
    </div>
    <button class="flex-none w-8 h-8 rounded-[10px] border-none bg-surface2 text-inksoft cursor-pointer flex items-center justify-center hover:text-bad hover:bg-badsoft" id="split-doc-clear" type="button" aria-label="นำไฟล์ออก">
      <i class="bi bi-x-lg text-sm leading-none"></i>
    </button>
  </div>

  <div class="panel bg-surface border border-line rounded-2xl p-4 shadow-sm mt-4" id="split-panel" style="display:none;">
    <div class="mb-3">
      <div class="flex flex-col gap-2">
        <label class="flex items-center gap-2 text-[13px] font-medium"><input type="radio" name="split-mode" value="each" class="accent-accent w-[15px] h-[15px]" checked /> แยกทุกหน้าเป็นไฟล์เดี่ยว</label>
        <label class="flex items-center gap-2 text-[13px] font-medium"><input type="radio" name="split-mode" value="custom" class="accent-accent w-[15px] h-[15px]" /> กำหนดช่วงหน้าเอง</label>
      </div>
    </div>
    <div class="mb-3" id="split-ranges-field" style="display:none;">
      <label class="block text-[12px] font-semibold text-inksoft mb-1.5" for="split-ranges">ช่วงหน้า (แต่ละกลุ่มคือ 1 ไฟล์)</label>
      <input type="text" id="split-ranges" class="w-full px-2.5 py-2 rounded-lg border border-line bg-surface2 text-ink text-[13px] focus:outline focus:outline-2 focus:outline-accent focus:outline-offset-1" placeholder="เช่น 1-3, 4, 5-8" />
    </div>
    <button class="btn w-full mt-3.5 px-3.5 py-2.5 rounded-xl border-none bg-accent text-accentink text-sm font-bold cursor-pointer flex items-center justify-center gap-2 hover:bg-accentdeep" id="btn-split" type="button">
      <span class="spinner hidden w-[15px] h-[15px] rounded-full border-2 border-white/40 border-t-current animate-spin"></span>
      <span class="btn-label">แยกและบันทึก</span>
    </button>
    <div class="progress-track hidden h-[5px] rounded-full bg-surface2 mt-3 overflow-hidden" id="split-progress"><div class="progress-fill h-full bg-accent rounded-full w-0 transition-[width] duration-150"></div></div>
    <div class="status-line mt-2.5 text-[12.5px] min-h-[16px]" id="split-status"></div>
  </div>
</section>
