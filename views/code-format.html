<section id="view-code-format" class="animate-fade-in" hidden>
  <div class="mt-4 mb-3">
    <button class="inline-flex items-center gap-1.5 bg-transparent border-none text-inksoft text-sm font-semibold cursor-pointer py-1.5 hover:text-ink" id="btn-code-format-back" type="button">
      <i class="bi bi-chevron-left text-base leading-none"></i>
      กลับหน้าหลัก
    </button>
  </div>

  <div class="flex items-center justify-between flex-wrap gap-3 mb-3">
    <div class="flex items-center gap-3">
      <span class="flex h-9 w-9 flex-none items-center justify-center rounded-full bg-accentsoft text-accent">
        <i class="bi bi-braces text-lg leading-none"></i>
      </span>
      <h2 class="text-xl font-extrabold">จัดรูปแบบโค้ด</h2>
    </div>
    <!-- Option values map to CODE_FORMAT_LANGS / SQL_DIALECTS in js/app.js -->
    <div class="flex items-center gap-2 flex-wrap">
      <label class="flex items-center gap-1.5 text-[12px] font-semibold text-inksoft whitespace-nowrap">ภาษา
        <select id="codefmt-lang" class="rounded-lg border border-line bg-surface2 text-ink text-[12.5px] font-semibold px-2 py-1.5 focus:outline focus:outline-2 focus:outline-accent focus:outline-offset-1">
          <option value="auto" selected>ตรวจจับอัตโนมัติ</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="javascript">JavaScript</option>
          <option value="json">JSON</option>
          <option value="sql">SQL</option>
        </select>
      </label>
      <label class="flex items-center gap-1.5 text-[12px] font-semibold text-inksoft whitespace-nowrap">ย่อหน้า
        <select id="codefmt-indent" class="rounded-lg border border-line bg-surface2 text-ink text-[12.5px] font-semibold px-2 py-1.5 focus:outline focus:outline-2 focus:outline-accent focus:outline-offset-1">
          <option value="2" selected>2 ช่องว่าง</option>
          <option value="4">4 ช่องว่าง</option>
          <option value="tab">Tab</option>
        </select>
      </label>
      <!-- SQL-only options; shown by js/app.js when the language is (or is detected as) SQL. -->
      <div id="codefmt-sql-options" class="items-center gap-2 flex-wrap" style="display:none;">
        <label class="flex items-center gap-1.5 text-[12px] font-semibold text-inksoft whitespace-nowrap">ฐานข้อมูล
          <select id="codefmt-dialect" class="rounded-lg border border-line bg-surface2 text-ink text-[12.5px] font-semibold px-2 py-1.5 focus:outline focus:outline-2 focus:outline-accent focus:outline-offset-1">
            <option value="sql" selected>Standard SQL</option>
            <option value="transactsql">SQL Server (T-SQL)</option>
            <option value="mysql">MySQL</option>
            <option value="mariadb">MariaDB</option>
            <option value="postgresql">PostgreSQL</option>
            <option value="plsql">Oracle (PL/SQL)</option>
            <option value="sqlite">SQLite</option>
            <option value="bigquery">BigQuery</option>
          </select>
        </label>
        <label class="flex items-center gap-1.5 text-[12px] font-semibold text-inksoft whitespace-nowrap">Keyword
          <select id="codefmt-keyword" class="rounded-lg border border-line bg-surface2 text-ink text-[12.5px] font-semibold px-2 py-1.5 focus:outline focus:outline-2 focus:outline-accent focus:outline-offset-1">
            <option value="upper" selected>UPPER</option>
            <option value="lower">lower</option>
            <option value="preserve">คงเดิม</option>
          </select>
        </label>
      </div>
      <button type="button" id="btn-codefmt-format" class="flex items-center gap-1.5 bg-accent text-accentink text-[12.5px] font-bold px-3 py-1.5 rounded-lg cursor-pointer hover:bg-accentdeep disabled:opacity-60 disabled:pointer-events-none">
        <span class="spinner hidden w-[12px] h-[12px] rounded-full border-2 border-white/40 border-t-current animate-spin"></span>
        <i class="bi bi-magic text-sm leading-none"></i> จัดรูปแบบ
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 bg-surface border border-line rounded-2xl shadow-sm overflow-hidden">
    <div class="flex flex-col min-w-0 md:border-r border-line">
      <div class="flex items-center justify-between gap-2 px-4 py-2.5 border-b border-line">
        <label class="text-[13px] font-bold whitespace-nowrap" for="codefmt-input">โค้ดต้นฉบับ</label>
        <div class="flex items-center gap-3">
          <button type="button" id="btn-codefmt-open" title="เปิดไฟล์" aria-label="เปิดไฟล์" class="flex items-center gap-1 bg-transparent border-none text-inksoft text-[12px] font-semibold cursor-pointer hover:text-accentdeep">
            <i class="bi bi-folder2-open text-sm leading-none"></i><span class="hidden sm:inline">เปิดไฟล์</span>
          </button>
          <button type="button" id="btn-codefmt-clear" title="ล้าง" aria-label="ล้าง" class="flex items-center gap-1 bg-transparent border-none text-inksoft text-[12px] font-semibold cursor-pointer hover:text-bad">
            <i class="bi bi-eraser text-sm leading-none"></i><span class="hidden sm:inline">ล้าง</span>
          </button>
        </div>
      </div>
      <textarea id="codefmt-input" spellcheck="false" wrap="off" class="w-full h-[45vh] md:h-[calc(100vh-235px)] min-h-[260px] md:min-h-[360px] px-4 py-3 border-none bg-surface text-ink text-[12.5px] font-mono leading-relaxed resize-y outline-none" placeholder="วางโค้ด HTML, CSS, JavaScript, JSON หรือ SQL ที่นี่..."></textarea>
      <div class="px-4 py-1.5 border-t border-line text-[11.5px] text-inkfaint text-right font-mono" id="codefmt-input-meta">บรรทัด 0 · ตัวอักษร 0</div>
    </div>
    <div class="flex flex-col min-w-0 border-t md:border-t-0 border-line">
      <div class="flex items-center justify-between gap-2 px-4 py-2.5 border-b border-line">
        <label class="text-[13px] font-bold whitespace-nowrap" for="codefmt-output">ผลลัพธ์</label>
        <div class="flex items-center gap-3">
          <button type="button" id="btn-codefmt-copy" title="คัดลอก" aria-label="คัดลอก" class="flex items-center gap-1 bg-transparent border-none text-inksoft text-[12px] font-semibold cursor-pointer hover:text-accentdeep">
            <i class="bi bi-clipboard text-sm leading-none"></i><span class="hidden sm:inline">คัดลอก</span>
          </button>
          <button type="button" id="btn-codefmt-download" title="ดาวน์โหลด" aria-label="ดาวน์โหลด" class="flex items-center gap-1 bg-transparent border-none text-inksoft text-[12px] font-semibold cursor-pointer hover:text-accentdeep">
            <i class="bi bi-download text-sm leading-none"></i><span class="hidden sm:inline">ดาวน์โหลด</span>
          </button>
        </div>
      </div>
      <textarea id="codefmt-output" readonly spellcheck="false" wrap="off" class="w-full h-[45vh] md:h-[calc(100vh-235px)] min-h-[260px] md:min-h-[360px] px-4 py-3 border-none bg-surface2 text-ink text-[12.5px] font-mono leading-relaxed resize-y outline-none" placeholder="โค้ดที่จัดรูปแบบแล้วจะแสดงที่นี่"></textarea>
      <div class="px-4 py-1.5 border-t border-line text-[11.5px] text-inkfaint text-right font-mono" id="codefmt-output-meta">บรรทัด 0 · ตัวอักษร 0</div>
    </div>
  </div>
  <input type="file" id="codefmt-file-input" accept=".html,.htm,.css,.js,.mjs,.cjs,.json,.sql,.txt" class="sr-only" />
  <div class="status-line mt-2.5 text-[12.5px] min-h-[16px]" id="codefmt-status"></div>
</section>
